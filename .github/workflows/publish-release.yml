---
name: Publish Release
permissions: {}

concurrency:
  group: cli-release-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: github-release
    permissions:
      attestations: write # Store signed provenance for release artifacts.
      contents: write # Required to create the GitHub release and upload assets.
      id-token: write # Mint the short-lived Sigstore signing identity.
    steps:
      - name: Check Out Release Tag
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set Up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: "go.mod"
          cache: false

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: v2.17.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Locate Checksum Manifest
        id: checksums
        run: |
          set -euo pipefail
          checksum_path="$(find dist -maxdepth 1 -type f -name '*_checksums.txt' -print -quit)"
          test -n "$checksum_path"
          echo "path=$checksum_path" >> "$GITHUB_OUTPUT"

      - name: Attest Release Assets
        id: attest
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-checksums: ${{ steps.checksums.outputs.path }}

      - name: Attach Provenance
        env:
          ATTESTATION_BUNDLE: ${{ steps.attest.outputs.bundle-path }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          install -m 0644 "$ATTESTATION_BUNDLE" dist/provenance.intoto.jsonl
          gh release upload "$RELEASE_TAG" dist/provenance.intoto.jsonl --clobber

      - name: Publish Verified Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release edit "$RELEASE_TAG" --draft=false --latest --verify-tag
