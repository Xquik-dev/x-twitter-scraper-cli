---
name: Publish Release
permissions: {}

concurrency:
  group: cli-release
  cancel-in-progress: false

on:
  push:
    branches:
      - main
    paths:
      - ".release-please-manifest.json"
  workflow_dispatch:
    inputs:
      release_ref:
        description: Exact release tag to publish
        required: true
        type: string

jobs:
  prepare:
    name: Prepare Draft Release
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: write # Dispatch the tag-bound publisher.
      contents: write # Create the exact release tag.
    steps:
      - name: Check Out Release Commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare Immutable Draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          version="$(jq -er '."."' .release-please-manifest.json)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]
          release_tag="v${version}"
          release_json=""

          for _ in {1..30}; do
          if release_json="$(
            gh api --paginate --slurp \
              "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
              2>/dev/null |
              jq -ce --arg tag "$release_tag" '
                [.[][] | select(.tag_name == $tag)]
                | if length == 1 then
                    {
                      isDraft: .[0].draft,
                      tagName: .[0].tag_name,
                      targetCommitish: .[0].target_commitish
                    }
                  else
                    empty
                  end
              '
          )"; then
              break
            fi
            sleep 10
          done

          test -n "$release_json"
          test "$(jq -r '.isDraft' <<<"$release_json")" = "true"
          test "$(jq -r '.tagName' <<<"$release_json")" = "$release_tag"
          test "$(jq -r '.targetCommitish' <<<"$release_json")" = "$GITHUB_SHA"

          if remote_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${release_tag}" --jq '.object.sha' 2>/dev/null)"; then
            test "$remote_sha" = "$GITHUB_SHA"
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/tags/${release_tag}" \
              -f sha="$GITHUB_SHA" >/dev/null
          fi

          gh workflow run publish-release.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$release_tag" \
            -f release_ref="$release_tag"

  release:
    name: Build & Publish Release
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: github-release
    permissions:
      attestations: write # Store signed provenance for release artifacts.
      contents: write # Required to create the GitHub release and upload assets.
      id-token: write # Mint the short-lived Sigstore signing identity.
    steps:
      - name: Check Out Release Tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify Immutable Draft
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_ref }}
        run: |
          set -euo pipefail

          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]
          test "$GITHUB_REF_TYPE" = "tag"
          test "$GITHUB_REF_NAME" = "$RELEASE_TAG"
          version="$(jq -er '."."' .release-please-manifest.json)"
          test "$RELEASE_TAG" = "v${version}"
          release_json="$(
            gh api --paginate --slurp \
              "repos/${GITHUB_REPOSITORY}/releases?per_page=100" |
              jq -ce --arg tag "$RELEASE_TAG" '
                [.[][] | select(.tag_name == $tag)]
                | if length == 1 then
                    {
                      isDraft: .[0].draft,
                      tagName: .[0].tag_name,
                      targetCommitish: .[0].target_commitish
                    }
                  else
                    empty
                  end
              '
          )"

          test "$(jq -r '.isDraft' <<<"$release_json")" = "true"
          test "$(jq -r '.tagName' <<<"$release_json")" = "$RELEASE_TAG"
          test "$(jq -r '.targetCommitish' <<<"$release_json")" = "$GITHUB_SHA"
          test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Set Up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "go.mod"
          cache: false

      - name: Verify Module Integrity
        run: go mod verify

      - name: Check Licensing
        uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 # v6.0.0

      - name: Run Release Tests
        run: ./scripts/test

      - name: Scan Reachable Vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: v2.17.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify Debug Information
        run: ./bin/check-release-debug-info

      - name: Locate Checksum Manifest
        id: checksums
        run: |
          set -euo pipefail
          checksum_path="$(find dist -maxdepth 1 -type f -name '*_checksums.txt' -print -quit)"
          test -n "$checksum_path"
          echo "path=$checksum_path" >> "$GITHUB_OUTPUT"

      - name: Attest Release Assets
        id: attest
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-checksums: ${{ steps.checksums.outputs.path }}

      - name: Attach Provenance
        env:
          ATTESTATION_BUNDLE: ${{ steps.attest.outputs.bundle-path }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          install -m 0644 "$ATTESTATION_BUNDLE" dist/provenance.intoto.jsonl
          gh release upload "$RELEASE_TAG" dist/provenance.intoto.jsonl --clobber

      - name: Publish Verified Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: gh release edit "$RELEASE_TAG" --draft=false --latest --verify-tag
