name: CI

permissions:
  contents: read

concurrency:
  group: cli-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - "**"
      - "!integrated/**"
      - "!stl-preview-head/**"
      - "!stl-preview-base/**"
      - "!generated"
      - "!codegen/**"
      - "codegen/stl/**"
  pull_request:
    branches-ignore:
      - "stl-preview-head/**"
      - "stl-preview-base/**"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check Out Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set Up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: "go.mod"
          cache: false

      - name: Bootstrap
        run: ./scripts/bootstrap

      - name: Check Licensing
        uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 # v6.0.0

      - name: Run Lints
        run: ./scripts/lint

  test:
    name: Test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check Out Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set Up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: "go.mod"
          cache: false

      - name: Bootstrap
        run: ./scripts/bootstrap

      - name: Run Tests
        run: ./scripts/test

  security:
    name: Dependency Security
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check Out Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set Up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: "go.mod"
          cache: false

      - name: Verify Module Integrity
        run: go mod verify

      - name: Scan Reachable Vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check Out Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set Up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: "go.mod"
          cache: false

      - name: Bootstrap
        run: ./scripts/bootstrap

      - name: Build Snapshot
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: v2.17.0
          args: release --snapshot --clean

      - name: Preserve First Checksum Manifest
        env:
          FIRST_CHECKSUMS: ${{ runner.temp }}/first-checksums.txt
        run: |
          set -euo pipefail
          checksum_path="$(find dist -maxdepth 1 -type f -name '*_checksums.txt' -print -quit)"
          test -n "$checksum_path"
          install -m 0644 "$checksum_path" "$FIRST_CHECKSUMS"

      - name: Rebuild Snapshot
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: v2.17.0
          args: release --snapshot --clean

      - name: Verify Debug Information
        run: ./bin/check-release-debug-info

      - name: Verify Reproducible Checksums
        env:
          FIRST_CHECKSUMS: ${{ runner.temp }}/first-checksums.txt
        run: |
          set -euo pipefail
          checksum_path="$(find dist -maxdepth 1 -type f -name '*_checksums.txt' -print -quit)"
          test -n "$checksum_path"
          cmp "$FIRST_CHECKSUMS" "$checksum_path"
