name: Refresh Context7 Documentation

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/context7-refresh.yml"
      - "README.md"
      - "context7.json"
      - "go.mod"
      - "go.sum"
      - "cmd/**"
      - "internal/**"
      - "pkg/**"
      - "scripts/**"
  workflow_dispatch:

permissions: {}

concurrency:
  group: context7-refresh-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh:
    name: Refresh Documentation Index
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Request Context7 Refresh
        env:
          CONTEXT7_API_KEY: ${{ secrets.CONTEXT7_API_KEY }}
        run: |
          set -euo pipefail

          if [ -z "$CONTEXT7_API_KEY" ]; then
            echo "::warning ::Context7 API key is missing. Add CONTEXT7_API_KEY to enable refreshes."
            exit 0
          fi

          body_file="$(mktemp)"
          trap 'rm -f "$body_file"' EXIT
          status="$(curl --connect-timeout 10 --max-time 30 --proto '=https' -sS --tlsv1.2 -o "$body_file" -w "%{http_code}" -X POST "https://context7.com/api/v1/refresh" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${CONTEXT7_API_KEY}" \
            -d '{"libraryName": "/xquik-dev/x-twitter-scraper-cli"}')"

          case "$status" in
            200|202)
              cat "$body_file"
              ;;
            400)
              if grep -Eiq "active-task|being processed|already.*process" "$body_file"; then
                echo "::warning ::Another Context7 refresh is running. This workflow will retry after the next docs change."
                cat "$body_file"
              elif grep -Eiq "too-early|minimum .* days|required between updates" "$body_file"; then
                echo "::warning ::Context7 refresh is not due. This workflow will retry after the next docs change."
                cat "$body_file"
              else
                echo "::error ::Context7 rejected the refresh with HTTP $status. Check the response below."
                cat "$body_file"
                exit 1
              fi
              ;;
            404)
              echo "::warning ::Context7 library /xquik-dev/x-twitter-scraper-cli is unavailable. Wait for initial processing."
              cat "$body_file"
              ;;
            401|403)
              echo "::error ::Context7 authentication failed. Update CONTEXT7_API_KEY."
              exit 1
              ;;
            429)
              echo "::warning ::Context7 rate limit reached. This workflow will retry after the next docs change."
              ;;
            *)
              echo "::error ::Context7 refresh failed with HTTP $status. Check the response below."
              cat "$body_file"
              exit 1
              ;;
          esac
